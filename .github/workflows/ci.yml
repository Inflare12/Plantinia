name: Plantinia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: plantinia-ci-secret-change-me-32-characters-long
      DATABASE_URL: ''
      AI_PROVIDER: mock
      EMAIL_PROVIDER: mock
      STORAGE_PROVIDER: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run tests
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NODE_ENV: production
          JWT_SECRET: plantinia-ci-production-secret-change-me-32-characters-long
          DATABASE_URL: postgresql://ci:ci@example.com:5432/plantinia
          AI_PROVIDER: custom
          CUSTOM_INFERENCE_URL: https://example.com/inference
          CUSTOM_INFERENCE_API_KEY: ci-placeholder
          EMAIL_PROVIDER: smtp
          SMTP_HOST: smtp.example.com
          SMTP_PORT: 587
          SMTP_USER: ci@example.com
          SMTP_PASSWORD: ci-placeholder
          STORAGE_PROVIDER: supabase
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXT_PUBLIC_STORAGE_PUBLIC_URL: https://example.supabase.co/storage/v1/object/public/plantinia-media
          NEXT_PUBLIC_APP_URL: https://plantinia.example.com
        run: npm run build
